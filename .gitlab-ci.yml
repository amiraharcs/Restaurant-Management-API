stages:
  - test
  - build
  - deploy

include:
  - local: 'backend/.gitlab-ci.yml'
  - local: 'deploy/oracle/gitlab-ci.deploy.yml'
stages:
  - deploy

deploy_prod:
  stage: deploy
  image: alpine:3.20
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$DEPLOY_SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan -H "$DEPLOY_SERVER_HOST" >> ~/.ssh/known_hosts
  script:
    - |
      ssh "$DEPLOY_SERVER_USER@$DEPLOY_SERVER_HOST" "
      cd /opt/teamproject36 &&
      git fetch origin main &&
      git reset --hard origin/main &&
      cp -n .env.prod.example .env.prod &&
      docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
      "
