stages:
  - test
  - build

cache:
  key: maven-cache
  paths:
    - .m2/repository

backend:test:
  stage: test
  image: maven:3.9.9-eclipse-temurin-17
  services:
    - name: postgres:16
      alias: db
  variables:
    POSTGRES_DB: oaxaca
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres

    DB_URL: jdbc:postgresql://db:5432/oaxaca
    DB_USER: postgres
    DB_PASS: postgres
  before_script:
    - cd backend
  script:
    - ./mvnw test

backend:build:
  stage: build
  image: maven:3.9.9-eclipse-temurin-17
  before_script:
    - cd backend
  script:
    - ./mvnw package -DskipTests
  artifacts:
    paths:
      - backend/target/*.jar
    expire_in: 7 days

